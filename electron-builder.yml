appId: com.xiaotaoya2022.nexus
productName: Nexus
directories:
  output: release
  buildResources: build
# 用 node_modules 里已解压的 Electron（开发依赖同版本），打包零下载（公司网络/代理波动时不再卡 TLS）
electronDist: node_modules/electron/dist
files:
  - out/**
  - package.json
  # 托盘/窗口图标随包发布（生产 appPath=asar 内无 build/ 曾致托盘空白）
  - build/icon.ico
  - build/icon.png
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  include: build/installer.nsh
portable:
  artifactName: Nexus-Portable-${version}.exe
npmRebuild: false
